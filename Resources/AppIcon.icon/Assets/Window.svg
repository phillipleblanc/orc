<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The mask's black shapes are cut out, so the background shows through as the prompt and the gaps around the fingers. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="230" y="486" width="50" height="78" rx="25"/><rect x="268" y="486" width="50" height="88" rx="25"/><rect x="306" y="486" width="50" height="82" rx="25"/>
        <rect x="668" y="486" width="50" height="82" rx="25"/><rect x="706" y="486" width="50" height="88" rx="25"/><rect x="744" y="486" width="50" height="78" rx="25"/>
      </g>
      <path d="M282,630 L360,684 L282,738" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="398" y="716" width="122" height="40" rx="20" fill="#000000"/>
    </mask>
  </defs>
  <g transform="scale(1.242718) translate(-100 -100)">
    <rect x="176" y="524" width="672" height="300" rx="56" fill="#FFFFFF" mask="url(#cut)"/>
  </g>
</svg>
