<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Conversation</title>
  <meta name="description" content="A focused chat: the answer as prose, tool calls as compact steps, a floating composer.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="who">
      <span class="dot" id="state-dot" aria-hidden="true"></span>
      <span class="name" id="session-name"></span>
    </div>
    <button class="model" id="model-button" type="button" aria-haspopup="dialog" aria-expanded="false">
      <span id="model-name">—</span>
      <span class="thinking" id="thinking-level"></span>
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="spacer"></div>
    <div class="usage" id="usage" title="Context used and spend"></div>
    <button class="icon" id="menu-button" type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>
    </button>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main class="scroller" id="scroller">
    <div class="column">
      <section class="empty" id="empty" hidden>
        <div class="empty-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M6 9.5A3.5 3.5 0 0 1 9.5 6h13A3.5 3.5 0 0 1 26 9.5v8a3.5 3.5 0 0 1-3.5 3.5H14l-5 4.5V21h0.5A3.5 3.5 0 0 1 6 17.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </div>
        <h1>What should we work on?</h1>
        <p id="empty-detail"></p>
      </section>
      <div class="log" id="log"></div>
      <div class="log live" id="live" aria-live="off"></div>
    </div>
  </main>

  <button class="jump" id="jump" type="button" hidden>
    <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.5v7M3 6.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Latest
  </button>

  <footer class="dock">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="queue" id="queue"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Message the agent" aria-label="Message" autocomplete="off" spellcheck="true"></textarea>
      <div class="actions">
        <span class="hint" id="hint"></span>
        <button class="queue-button" id="queue-button" type="button" hidden>Queue</button>
        <button class="send" id="send" type="submit" aria-label="Send">
          <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="square" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1.5" fill="currentColor"/></svg>
        </button>
      </div>
    </form>
  </footer>

  <div class="popover" id="model-popover" role="dialog" aria-label="Model" hidden>
    <input id="model-filter" type="search" placeholder="Search models" aria-label="Search models" autocomplete="off">
    <div class="models" id="model-list" role="listbox"></div>
    <div class="levels" id="levels" role="radiogroup" aria-label="Thinking"></div>
  </div>

  <div class="menu" id="menu" role="menu" hidden>
    <button type="button" role="menuitem" data-action="compact">Summarize earlier context</button>
    <button type="button" role="menuitem" data-action="new">Start a new context…</button>
    <div class="menu-info" id="menu-info"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
